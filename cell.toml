# One repo = one cell = one function. Every cell of every ce-net cell system, per node: wanted against running,
# source and commit, drift. The Core tab of apps.ce-net.com and the control room's cells slot (SITES-ON-CELLS.md 8).
[cell]
api = "site.cellmap"
crate = "site-cellmap"
args = ["serve"]
kind = "function"
owner = "foreman/lead"
keep = true  # its background probe must keep running
depends_on = []

[launch]
health = "HealthOp"
start_timeout_ms = 5000
restart_backoff_ms = [1000, 300000]

[placement]
# the CORE system in repo:ce-net-net (replicas 2)

[limits]
disk_bytes = "64M"

[stamp]
id = "cell:site.cellmap"
kind = "cell"
path = "cell.toml"
updated_at = 2026-11-16T01:24:42Z
version = "0.2"
access = "public"
canonical_of = []
duplicate_of = ""
owner = "foreman/lead"
source_of_truth = "https://github.com/ce-net/site-cellmap"
stale_after = 180
